<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Green Thumb — one-shot tap with blue inhibit</text>
<!-- GRN_SGNL -->
<circle cx="50" cy="150" r="9" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
<text x="50" y="128" text-anchor="middle" font-size="13" fill="#1D9E75">GRN_SGNL</text>
<text x="50" y="178" text-anchor="middle" font-size="11" fill="#666">green driver base</text>
<line x1="59" y1="150" x2="140" y2="150" stroke="#222" stroke-width="2"/>
<circle cx="140" cy="150" r="3.5" fill="#222"/>
<!-- R1 bleed -->
<line x1="140" y1="150" x2="140" y2="210" stroke="#222" stroke-width="2"/>
<rect x="128" y="210" width="24" height="56" fill="none" stroke="#222" stroke-width="2"/>
<text x="162" y="242" font-size="13" fill="#222">R1</text>
<line x1="140" y1="266" x2="140" y2="282" stroke="#222" stroke-width="2"/><line x1="128" y1="282" x2="152" y2="282" stroke="#222" stroke-width="2"/><line x1="132" y1="287" x2="148" y2="287" stroke="#222" stroke-width="2"/><line x1="136" y1="292" x2="144" y2="292" stroke="#222" stroke-width="2"/>
<!-- C1 -->
<line x1="140" y1="150" x2="210" y2="150" stroke="#222" stroke-width="2"/>
<line x1="210" y1="130" x2="210" y2="170" stroke="#222" stroke-width="3"/>
<line x1="222" y1="130" x2="222" y2="170" stroke="#222" stroke-width="3"/>
<text x="216" y="118" text-anchor="middle" font-size="13" fill="#222">C1</text>
<line x1="222" y1="150" x2="270" y2="150" stroke="#222" stroke-width="2"/>
<!-- R2 series -->
<rect x="270" y="138" width="56" height="24" fill="none" stroke="#222" stroke-width="2"/>
<text x="298" y="128" text-anchor="middle" font-size="13" fill="#222">R2</text>
<line x1="326" y1="150" x2="400" y2="150" stroke="#222" stroke-width="2"/>
<circle cx="370" cy="150" r="4" fill="#378ADD"/>
<text x="370" y="128" text-anchor="middle" font-size="11" fill="#378ADD">clamp node</text>
<!-- Q1 -->
<rect x="400" y="90" width="180" height="130" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="490" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Q1  digital transistor</text>
<text x="408" y="140" font-size="11" fill="#222">1 IN</text>
<rect x="440" y="143" width="34" height="14" fill="none" stroke="#555" stroke-width="1.5"/>
<line x1="474" y1="150" x2="510" y2="150" stroke="#555" stroke-width="1.5"/>
<circle cx="492" cy="150" r="2.5" fill="#555"/>
<line x1="492" y1="150" x2="492" y2="168" stroke="#555" stroke-width="1.5"/>
<rect x="485" y="168" width="14" height="30" fill="none" stroke="#555" stroke-width="1.5"/>
<line x1="492" y1="198" x2="492" y2="206" stroke="#555" stroke-width="1.5"/>
<line x1="510" y1="136" x2="510" y2="164" stroke="#222" stroke-width="3"/>
<line x1="510" y1="142" x2="540" y2="122" stroke="#222" stroke-width="2"/>
<line x1="510" y1="158" x2="540" y2="178" stroke="#222" stroke-width="2"/>
<polygon points="540,178 529,176 535,167" fill="#222"/>
<line x1="540" y1="122" x2="540" y2="90" stroke="#222" stroke-width="2"/>
<line x1="540" y1="178" x2="540" y2="206" stroke="#222" stroke-width="2"/>
<line x1="492" y1="206" x2="540" y2="206" stroke="#222" stroke-width="2"/>
<line x1="540" y1="206" x2="540" y2="220" stroke="#222" stroke-width="2"/>
<text x="548" y="104" font-size="11" fill="#222">3 OUT</text>
<text x="548" y="216" font-size="11" fill="#222">2 GND</text>
<line x1="540" y1="90" x2="540" y2="60" stroke="#222" stroke-width="2"/>
<line x1="540" y1="60" x2="690" y2="60" stroke="#222" stroke-width="2"/>
<circle cx="699" cy="60" r="9" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
<text x="716" y="64" font-size="13" fill="#1D9E75">BTN</text>
<line x1="540" y1="220" x2="540" y2="400" stroke="#222" stroke-width="2"/>
<!-- Q2 inhibit -->
<circle cx="50" cy="320" r="9" fill="none" stroke="#378ADD" stroke-width="2.5"/>
<text x="50" y="298" text-anchor="middle" font-size="13" fill="#378ADD">BLU_SGNL</text>
<text x="50" y="348" text-anchor="middle" font-size="11" fill="#666">blue driver base</text>
<line x1="59" y1="320" x2="250" y2="320" stroke="#222" stroke-width="2"/><line x1="250" y1="320" x2="250" y2="300" stroke="#222" stroke-width="2"/><line x1="250" y1="300" x2="300" y2="300" stroke="#222" stroke-width="2"/>
<rect x="300" y="250" width="160" height="110" rx="8" fill="#eef4fb" stroke="#378ADD" stroke-width="2"/>
<text x="308" y="350" font-size="12" font-weight="bold" fill="#378ADD">Q2 inhibit</text>
<text x="308" y="294" font-size="11" fill="#222">1 IN</text>
<line x1="335" y1="300" x2="370" y2="300" stroke="#555" stroke-width="1.5"/>
<line x1="370" y1="286" x2="370" y2="314" stroke="#222" stroke-width="3"/>
<line x1="370" y1="292" x2="400" y2="272" stroke="#222" stroke-width="2"/>
<line x1="370" y1="308" x2="400" y2="328" stroke="#222" stroke-width="2"/>
<polygon points="400,328 389,326 395,317" fill="#222"/>
<line x1="400" y1="272" x2="400" y2="250" stroke="#222" stroke-width="2"/>
<text x="408" y="264" font-size="11" fill="#222">3 OUT</text>
<line x1="400" y1="328" x2="400" y2="360" stroke="#222" stroke-width="2"/>
<text x="408" y="350" font-size="11" fill="#222">2 GND</text>
<line x1="400" y1="250" x2="400" y2="232" stroke="#378ADD" stroke-width="2.5"/>
<line x1="400" y1="232" x2="370" y2="232" stroke="#378ADD" stroke-width="2.5"/>
<line x1="370" y1="232" x2="370" y2="154" stroke="#378ADD" stroke-width="2.5"/>
<line x1="400" y1="360" x2="400" y2="400" stroke="#222" stroke-width="2"/>
<!-- GND bus -->
<line x1="400" y1="400" x2="690" y2="400" stroke="#222" stroke-width="2"/>
<circle cx="699" cy="400" r="9" fill="none" stroke="#E8590C" stroke-width="2.5"/>
<text x="716" y="404" font-size="13" fill="#E8590C">GND</text>
<!-- notes -->
<text x="400" y="430" text-anchor="middle" font-size="11" fill="#666">Green rises alone → step passes C1 + R2 → Q1 pulls BTN low ~100 ms → releases.  R1 drains C1 afterwards.</text>
<text x="400" y="450" text-anchor="middle" font-size="11" fill="#666">Blue present (white, cyan) → Q2 holds the clamp node at 0 V → no tap.  R2 keeps the clamp from loading the green LED.</text>
</svg>